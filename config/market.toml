# Market-wide valuation inputs (not country-specific). Same rules as the country file:
# each value has a source and a date; `verified = true` (optional) means a person checked it.
# Unchecked values are used and listed in the result.

[risk_free_rate]
value = 0.0507
source = "US Treasury, Daily Treasury Par Yield Curve Rates, 10 Yr, 11/18/2026: 5.07%"
url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"
as_of = "2026-11-18"
verified = false
note = "fetched 2026-11-19. The plain 10-year yield. (Damodaran subtracts a US default spread, 0.23% in Jan 2026; not done here.)"

[mature_equity_risk_premium]
value = 0.0423
source = "Damodaran ctryprem.html: Cambodia total ERP 11.35% minus country risk premium 7.12% = mature-market ERP 4.23%"
url = "https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ctryprem.html"
as_of = "2026-01-05"
verified = false
note = "fetched 2026-11-19."

[terminal_growth]
value = 0.025
low = 0.020
high = 0.030
source = "judgement: long-run nominal USD growth, kept below the risk-free rate"
as_of = "2026-11-19"
verified = false

[forecast]
# Two-stage models: a first stage of `years` with growth taken from the company's own
# revenue history, clamped to [min, max], then the terminal growth rate. A shrinking company is
# projected to keep shrinking (down to growth_min), not held at zero, which would overvalue it.
years = 5
growth_min = -0.10
growth_max = 0.10
# Residual income (banks, regulated utilities): after the forecast years, the return above or below
# the cost of equity fades by this factor each year instead of lasting forever. 0.62 is the average
# persistence of abnormal earnings measured by Dechow, Hutton and Sloan (1999), "An empirical
# assessment of the residual income valuation model", Journal of Accounting and Economics 26.
excess_return_persistence = 0.62
source = "judgement starting point"
as_of = "2026-11-19"
verified = false

[sensitivity]
cost_of_capital_step = 0.01   # bear / bull: cost of capital +/- this
growth_step = 0.005           # bear / bull: terminal growth -/+ this
source = "judgement starting point"
as_of = "2026-11-19"
verified = false

