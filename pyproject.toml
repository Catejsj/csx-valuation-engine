[project]
name = "csx-valuation-engine"
version = "0.1.0.dev0"
description = "Page-traced financial statements and sector valuations for companies listed on the Cambodia Securities Exchange"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = ["pdfplumber==0.11.10", "pypdfium2==5.15.2"]

[project.scripts]
csx = "src.main:main"

[tool.setuptools]
packages = ["src", "src.core"]
